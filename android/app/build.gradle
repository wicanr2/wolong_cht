plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wicanr2.wolong'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.wicanr2.wolong'
        // The first reproducible AAR is bound with -androidapi 29.
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-touch-prototype'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
