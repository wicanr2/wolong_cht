plugins {
    id 'com.android.application'
}

def releaseVersion = providers.environmentVariable('WOLONG_RELEASE_VERSION').orElse('dev').get()
if (releaseVersion != 'dev' && !(releaseVersion ==~ /v\.[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}/)) {
    throw new GradleException('WOLONG_RELEASE_VERSION must use v.major.minor.patch-YYYYMMDD')
}
def androidVersionCode = providers.environmentVariable('WOLONG_ANDROID_VERSION_CODE').orElse('1').get().toInteger()

android {
    namespace 'com.wicanr2.wolong'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.wicanr2.wolong'
        // The first reproducible AAR is bound with -androidapi 29.
        minSdk 29
        targetSdk 35
        versionCode androidVersionCode
        versionName releaseVersion == 'dev' ? '0.1.0-touch-prototype' : releaseVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
