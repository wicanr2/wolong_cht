# 臥竜伝 三国制覇の計（PC-98 日文原版）
# 出處：msdostest garyouden-sangoku-seiha-no-kei-hokusho-neo-kobe-pc98-ia
# 差異：原設定掛 .hdi，這裡改掛我們手上的五片 .fdi
[dosbox]
memsize=8
machine=pc98
pc-98 sound bios=true
cascade interrupt ignore in service=true

[cpu]
# core=normal + 固定 cycles = 可重現的執行速度。
# 即時制遊戲沒有這一條就沒有 oracle，不要改成 auto。
core=normal
cputype=486
cycles=20000

[autoexec]
imgmount 0 "/orig/pc98_fdi/Garyou_A.fdi" "/orig/pc98_fdi/Garyou_B.fdi" "/orig/pc98_fdi/Garyou_C.fdi" "/orig/pc98_fdi/Garyou_D.fdi" "/orig/pc98_fdi/Garyou_E.fdi" -t floppy
boot -l a
