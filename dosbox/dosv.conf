# 臥龍傳（松崗 DOS/V 繁體中文版）
# msdostest 沒有收錄，本檔自行撰寫，尚未實測。
#
# machine 選 vgaonly：反組譯確認遊戲只用 VGA 的 Graphics Controller(3CE/3CF)
# 與 Sequencer(3C4)，是 16 色 4 平面 planar，不需要 SVGA。
# 打包版寫的 svga_s3 是打包者的選擇，不是原版需求（見 docs/re/02 §5）。
[dosbox]
memsize=16
machine=vgaonly

[cpu]
core=normal
cputype=486
cycles=20000

[dos]
xms=true
ems=true
umb=true

[autoexec]
mount c /orig/dosv
c:
START.BAT
